<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="LOOMY vision — editorial horizon">
  <defs>
    <linearGradient id="v-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6f1"/>
      <stop offset="45%" stop-color="#ebe4d8"/>
      <stop offset="100%" stop-color="#d4c9b8"/>
    </linearGradient>
    <radialGradient id="v-glow" cx="72%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c9a227" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v-mist" cx="22%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
    </linearGradient>
    <linearGradient id="v-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5a10" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7c5a10" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a67c1a" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="v-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#v-sky)"/>
  <rect width="1400" height="900" fill="url(#v-glow)"/>
  <rect width="1400" height="900" fill="url(#v-mist)"/>
  <!-- subtle grain -->
  <g opacity="0.04" fill="#1c1917">
    <circle cx="120" cy="140" r="1.2"/><circle cx="340" cy="220" r="1"/><circle cx="890" cy="160" r="1.1"/>
    <circle cx="1120" cy="320" r="1"/><circle cx="680" cy="80" r="0.9"/><circle cx="520" cy="400" r="1"/>
  </g>
  <!-- editorial window -->
  <rect x="180" y="120" width="1040" height="660" rx="48" fill="url(#v-frame)" stroke="#d6cfc4" stroke-width="1"/>
  <rect x="220" y="160" width="960" height="580" rx="36" fill="#fdfcfa" stroke="#e8e0d4" stroke-width="0.5"/>
  <!-- horizon arc -->
  <path d="M 280 520 Q 700 380 1120 520" fill="none" stroke="url(#v-line)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 320 560 Q 700 460 1080 560" fill="none" stroke="#7c5a10" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round" filter="url(#v-soft)"/>
  <!-- focal ring -->
  <ellipse cx="700" cy="498" rx="120" ry="118" fill="none" stroke="#7c5a10" stroke-opacity="0.12" stroke-width="1"/>
  <ellipse cx="700" cy="498" rx="78" ry="76" fill="none" stroke="#7c5a10" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="700" cy="498" r="10" fill="#7c5a10" fill-opacity="0.85"/>
  <circle cx="700" cy="498" r="4" fill="#faf8f5"/>
  <!-- corner accent -->
  <path d="M 1020 220 L 1180 220 L 1180 280" fill="none" stroke="#7c5a10" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 220 680 L 220 780 L 320 780" fill="none" stroke="#a8a29e" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round"/>
</svg>
